# Render Blueprint - Deploy GhostNet Backend
# https://render.com/docs/blueprint-spec
# Frontend is deployed on Netlify: https://ghostnet-app.netlify.app

services:
  # Backend WebSocket Server
  - type: web
    name: ghostnet-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
