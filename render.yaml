# Render Blueprint - Deploy GhostNet
# https://render.com/docs/blueprint-spec
# Live at: https://ghostnet.app

services:
  # Backend WebSocket Server (api.ghostnet.app)
  - type: web
    name: ghostnet-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
    healthCheckPath: /health

  # Frontend Static Site (ghostnet.app)
  - type: web
    name: ghostnet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        value: wss://api.ghostnet.app/ws
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
